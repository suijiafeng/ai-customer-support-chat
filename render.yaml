services:
  - type: web
    name: ai-customer-support-chat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # AI 默认关闭，走本地规则；如需启用，在 Render 后台填入对应密钥并改为 true
      - key: AI_ENABLED
        value: "false"
      # 预设厂商，自带接口地址与默认模型；需要时再用 AI_BASE_URL / AI_MODEL 覆盖
      - key: AI_PROVIDER
        value: deepseek
      # 密钥不写入仓库，sync:false 表示由 Render 后台手动填写
      - key: AI_API_KEY
        sync: false
      # 持久化：留空时默认走容器内 SQLite，但 Render 文件系统是临时的（free 无持久磁盘），
      # 重新部署/重启会清空。要真正持久化，请填外部 Postgres 连接串（Neon/Supabase 等），
      # 或为服务挂一块 Render Disk 到 /data 并设 SQLITE_PATH=/data/assistflow.db（付费方案）。
      - key: DATABASE_URL
        sync: false
      # 客服 JWT 签名密钥：由 Render 自动生成随机值（生产缺失会拒绝启动）
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # 部署在 Render 反向代理后：开启 trust proxy，使限流按真实访客 IP 统计
      - key: TRUST_PROXY
        value: "1"
