services:
  - type: web
    name: ai-customer-support-chat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # AI 默认关闭，走本地规则；如需启用，在 Render 后台填入对应密钥并改为 true
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: deepseek
      # 密钥不写入仓库，sync:false 表示由 Render 后台手动填写
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
