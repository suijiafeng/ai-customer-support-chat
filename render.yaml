services:
  - type: web
    name: ai-customer-support-chat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # AI 默认关闭，走本地规则；如需启用，在 Render 后台填入对应密钥并改为 true
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: deepseek
      # 密钥不写入仓库，sync:false 表示由 Render 后台手动填写
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # 外部 Postgres 连接串（Neon/Supabase 等），留空则用内存、重启丢数据
      - key: DATABASE_URL
        sync: false
      # 客服 JWT 签名密钥：由 Render 自动生成随机值（生产缺失会拒绝启动）
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
