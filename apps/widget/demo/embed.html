<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>宿主网站嵌入示例</title></head>
<body style="font-family:sans-serif;padding:40px">
  <h1>这是任意一个宿主网站</h1>
  <p>下面这行 script 就是网站方需要粘贴的全部代码：</p>
  <pre>&lt;script src="/widget/widget.js"
        data-assistflow data-key="demo-site"

  <!-- 实际嵌入 -->
  <script src="/widget/widget.js" data-assistflow
          data-key="demo-site" data-api-base="" data-title="开发者 AI 助手"></script>
</body>
</html>
