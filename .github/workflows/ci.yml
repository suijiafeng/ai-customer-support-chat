name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: |
          npm start &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..30}; do
            curl -fsS http://localhost:3001/api/health && break
            sleep 1
          done
          npm run smoke
          node scripts/dialog-test.js

  # 生产镜像验证：保证 Dockerfile 能构建、容器能启动并通过健康检查
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t assistflow:ci .

      - name: Boot container and check health
        run: |
          docker run -d --name assistflow -p 3001:3001 \
            -e AUTH_SECRET=ci-only-secret assistflow:ci
          for i in {1..30}; do
            if curl -fsS http://localhost:3001/api/health; then exit 0; fi
            sleep 1
          done
          echo "health check failed"; docker logs assistflow; exit 1
