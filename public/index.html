<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssistFlow · 开发者主页 AI 助手</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="customer-body">
    <main class="customer-app">
      <section class="customer-hero" aria-label="开发者服务说明">
        <div class="brand compact customer-brand">
          <div class="brand-mark">AF</div>
          <div>
            <strong>AssistFlow</strong>
            <span>独立前端开发者主页</span>
          </div>
        </div>
        <h1 class="hero-heading">前端开发合作<br />从这里开始</h1>
        <p class="hero-desc">AI 助手介绍服务、报价方式、技术栈和项目进展；需要深入沟通时可联系开发者本人。</p>
        <div class="hero-stats">
          <div class="hero-stat">
            <strong>&lt;&thinsp;3s</strong>
            <span>AI 响应时间</span>
          </div>
          <div class="hero-stat">
            <strong>6+</strong>
            <span>服务方向</span>
          </div>
          <div class="hero-stat">
            <strong>24/7</strong>
            <span>全天候在线</span>
          </div>
        </div>
        <div class="customer-metrics" aria-label="服务承诺">
          <span>AI 智能分析</span>
          <span>安全加密传输</span>
          <span>开发者本人跟进</span>
        </div>
      </section>

      <section class="customer-chat">
        <header class="customer-chat-header">
          <div class="chat-title">
            <div class="chat-avatar" aria-hidden="true">AI</div>
            <div>
              <h2>开发者主页 AI 助手</h2>
              <p><span class="status-dot"></span><span id="statusText">在线服务中</span></p>
            </div>
          </div>
          <div class="customer-header-actions">
            <span id="visitorCode" class="visitor-code">访客码生成中</span>
            <a id="agentLink" href="/agent.html" target="_blank" rel="noopener">开发者端</a>
          </div>
        </header>

        <div id="modeBanner" class="mode-banner">
          <span class="mode-dot"></span>
          <span id="modeText">AI 自动接管</span>
        </div>

        <section class="identity-panel" aria-label="访客信息">
          <div class="field-group">
            <label for="customerName">称呼</label>
            <input id="customerName" autocomplete="name" maxlength="24" placeholder="可选" />
          </div>
          <div class="field-group">
            <label for="customerContact">联系方式</label>
            <input id="customerContact" autocomplete="email tel" maxlength="40" placeholder="手机号或邮箱，可选" />
          </div>
          <p id="profileStatus" class="profile-status">未填写也可以直接咨询</p>
        </section>

        <div id="messages" class="messages customer-messages">
          <article class="message bot">
            <div class="bot-avatar">AI</div>
            <div class="message-body">
              <div class="bubble">你好！我是开发者主页 AI 助手，可以介绍前端开发服务、报价方式、合作流程、技术栈、作品集和项目进展。</div>
              <div class="message-meta">刚刚</div>
            </div>
          </article>
        </div>

        <div class="quick-actions customer-actions" aria-label="常见问题">
          <button data-prompt="项目怎么报价？">服务报价</button>
          <button data-prompt="你主要使用什么技术栈？">技术栈</button>
          <button data-prompt="帮我查一下项目 P1001">查项目</button>
          <button data-prompt="我想联系开发者本人">联系本人</button>
        </div>

        <form id="chatForm" class="composer customer-composer">
          <input id="messageInput" autocomplete="off" placeholder="请输入你的问题" />
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <script src="/customer.js"></script>
  </body>
</html>
